[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "banking-recommendation-intelligence"
version = "0.1.0"
description = "Synthetic-data research prototype for privacy-aware mobile banking recommendations"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3.0",
  "pandas>=2.2,<3.0",
]


[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
